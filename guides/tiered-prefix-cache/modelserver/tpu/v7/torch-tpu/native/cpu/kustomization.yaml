apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../base/torch-tpu

namePrefix: tiered-prefix-cache-tpu-v7-torch-tpu-cpu-

labels:
  - pairs:
      llm-d.ai/guide: tiered-prefix-cache
      llm-d.ai/model: Qwen3-32B
      llm-d.ai/accelerator-variant: tpu-v7
      llm-d.ai/accelerator-vendor: google
      llm-d.ai/engine-type: torch-tpu
    includeSelectors: true
    includeTemplates: true
patches:
  - path: patch-vllm.yaml
